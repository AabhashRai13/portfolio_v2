<!DOCTYPE html>
<html lang="en">

<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aabhash Rai | Mobile App Developer for iOS &amp; Android</title>
    <meta name="description"
        content="Aabhash Rai is a Sydney-based mobile app developer with 6+ years building iOS and Android apps for charities, healthcare, government and NGOs. Available for freelance projects and full-time roles.">
    <link rel="canonical" href="https://aabhashrai.com/">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#FFF1E6">

    <!-- Link previews (LinkedIn, Slack, WhatsApp, X, Upwork) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aabhashrai.com/">
    <meta property="og:title" content="Aabhash Rai | Mobile App Developer for iOS &amp; Android">
    <meta property="og:description"
        content="6+ years building iOS and Android apps for charities, healthcare, government and NGOs. Available for freelance projects and full-time roles.">
    <meta property="og:image" content="https://aabhashrai.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon for Web -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            background: #FFF1E6;
        }

        /* Plain-HTML placeholder shown until Flutter paints its first frame. */
        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: #FFF1E6;
            color: #5C4033;
            font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
            text-align: center;
            animation: pulse 1.6s ease-in-out infinite;
        }

        #loader h1 {
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 40px;
        }

        #loader p {
            margin: 0;
            font-size: 16px;
            opacity: 0.8;
        }

        @keyframes pulse {
            50% { opacity: 0.55; }
        }

        @media (prefers-color-scheme: dark) {
            body, #loader {
                background: #1C1512;
                color: #F3E3D3;
            }
        }
    </style>
    <script>
        // One-time cleanup for visitors who registered a service worker from an earlier
        // deploy. Unregister it and purge its caches so they stop being served stale
        // assets. Safe to remove after a few weeks once returning visitors are cleaned up.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
            });
            if (window.caches) {
                caches.keys().then(function (keys) {
                    keys.forEach(function (k) { caches.delete(k); });
                });
            }
        }
    </script>
</head>

<body>
    <div id="loader">
        <h1>Aabhash Rai</h1>
        <p>Mobile app developer · iOS &amp; Android</p>
    </div>
    <script>
        window.addEventListener('flutter-first-frame', function () {
            var loader = document.getElementById('loader');
            if (loader) loader.remove();
        });
    </script>
    <script src="flutter_bootstrap.js" async></script>
</body>

</html>
