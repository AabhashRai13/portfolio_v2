name: Flutter Web CI/CD Deploy to Hostinger

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build-and-deploy:
    # "closed" also fires when a PR is closed without merging; only a merge
    # into main may deploy.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    # 📥 Checkout the repo
    - name: Checkout code
      uses: actions/checkout@v4

    # 🛠️ Set up Flutter SDK
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.7
        channel: stable
        cache: true

           # Step to create keys.dart
    - name: Create keys.dart
      run: |
          mkdir -p lib
          echo "const String emailJsServiceId = '${{ secrets.EMAILJS_SERVICE_ID }}';" > lib/keys.dart
          echo "const String emailJsTemplateId = '${{ secrets.EMAILJS_TEMPLATE_ID }}';" >> lib/keys.dart
          echo "const String emailJsPublicKey = '${{ secrets.EMAILJS_PUBLIC_KEY }}';" >> lib/keys.dart
          echo "const String emailJsPrivateKey = '${{ secrets.EMAILJS_PRIVATE_KEY }}';" >> lib/keys.dart
          echo "const String firebaseAppCheckWebSiteKey = '${{ secrets.FIREBASE_APP_CHECK_WEB_SITE_KEY }}';" >> lib/keys.dart
          
    # 📦 Install Dart/Flutter dependencies
    - name: Get dependencies
      run: flutter pub get

    # 🧪 Run unit tests — fail the deploy if any test fails
    - name: Run tests
      run: flutter test

    # 🧼 Clean previous builds (optional but recommended)
    - name: Clean build
      run: flutter clean

    # 🛠️ Build Flutter Web
    - name: Build Flutter Web
      run: flutter build web --release

    # 🔖 Give main.dart.js a new URL per build so browsers can cache it long term
    - name: Version main.dart.js
      run: |
        hash=$(sha256sum build/web/main.dart.js | cut -c1-12)
        sed -i "s|\"mainJsPath\":\"main.dart.js\"|\"mainJsPath\":\"main.dart.js?v=${hash}\"|" build/web/index.html
        # Stop the deploy if the bootstrap format changed: an unversioned
        # main.dart.js under the one-year cache header would go stale.
        grep -q "main.dart.js?v=${hash}" build/web/index.html

    # 🏷️ Add deploy marker for live verification & Cache-Buster
    - name: Create deploy marker and Cache-Buster
      run: |
        cat > build/web/deploy-info.txt <<EOF
        repo=${GITHUB_REPOSITORY}
        branch=${GITHUB_REF_NAME}
        commit=${GITHUB_SHA}
        run_id=${GITHUB_RUN_ID}
        run_number=${GITHUB_RUN_NUMBER}
        deployed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        EOF
        
        # Force cache revalidation on Hostinger (LiteSpeed/Apache)
        cat > build/web/.htaccess <<EOF
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            RewriteRule ^index\.html$ - [L]

            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
        </IfModule>

        <IfModule mod_headers.c>
            # Pages and manifests: always check for a new deploy, but reuse the
            # cached copy when unchanged (304) instead of downloading it again.
            <FilesMatch "\.(html|json)$">
                Header set Cache-Control "no-cache"
            </FilesMatch>
            # index.html requests main.dart.js?v=<hash>, so each build has its own URL.
            <FilesMatch "^main\.dart\.js$">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
        </IfModule>
        EOF

    # 🚫 Remove service worker to avoid aggressive caching
    - name: Remove flutter_service_worker.js
      run: rm -f build/web/flutter_service_worker.js

    # 🌐 Install lftp (FTP CLI client)
    - name: Install FTP client (lftp)
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp

    # 🚀 Deploy to Hostinger via FTP
    - name: Deploy to Hostinger
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        set -eu
        
        # Test common paths just in case, but rely heavily on . for Hostinger jailed FTP accounts.
        TARGET_DIR=""
        for DIR in "domains/aabhashrai.com/public_html" "public_html" "."; do
          echo "Testing if '$DIR' is accessible..."
          if lftp -c "
            set ssl:verify-certificate no;
            set cmd:fail-exit yes;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            cd $DIR;
            bye
          " >/dev/null 2>&1; then
            TARGET_DIR="$DIR"
            echo "✅ Successfully connected to: $DIR"
            break
          else
            echo "❌ Directory '$DIR' not found or not accessible."
          fi
        done

        if [ -z "$TARGET_DIR" ]; then
          echo "CRITICAL: Could not find any valid deployment directory!"
          exit 1
        fi

        echo "Deploying files to resolved remote dir: ${TARGET_DIR}"
        lftp -c "
          set ssl:verify-certificate no;
          set ftp:list-options -a;
          set xfer:clobber on;
          set cmd:fail-exit yes;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          lcd ./build/web;
          cd $TARGET_DIR;
          pwd;
          cls;
          mirror -R --delete --verbose --exclude-glob blog-media --exclude-glob blog-media/** ./ ./;
          cls;
          bye
        "
